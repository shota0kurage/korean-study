<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>学習設定 - Korean Study</title>

<link
    rel="stylesheet"
    href="style.css"
>

<script src="study-tracker.js"></script>

<style>

/* =========================================
   学習設定画面
========================================= */

.quiz-select-card{
    padding:30px;
}

.quiz-select-header{
    text-align:center;
    margin-bottom:30px;
}

.quiz-select-icon{
    font-size:3rem;
    margin-bottom:10px;
}

.quiz-select-header h1{
    margin:0;
    font-size:1.8rem;
}

.quiz-select-header p{
    margin-top:8px;
    color:var(--sub);
}


/* =========================================
   級選択
========================================= */

.level-title{
    font-size:1rem;
    font-weight:700;
    margin-bottom:12px;
}

.level-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

.level-button{
    padding:14px 10px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#16181c;
    color:var(--text);
    cursor:pointer;
    transition:
        background .2s ease,
        border-color .2s ease,
        transform .15s ease;
}

.level-button:hover{
    border-color:var(--primary);
    transform:translateY(-2px);
}

.level-button.selected{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
    box-shadow:
        0 5px 15px
        rgba(29,155,240,.25);
}

.level-button.disabled{
    background:rgba(255,255,255,.04);
    color:rgba(231,233,234,.35);
    border-color:rgba(47,51,54,.6);
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.level-button.disabled:hover{
    transform:none;
    background:rgba(255,255,255,.04);
    border-color:rgba(47,51,54,.6);
    box-shadow:none;
}


/* =========================================
   選択状況
========================================= */

.selected-info{
    text-align:center;
    color:var(--sub);
    font-size:.9rem;
    min-height:24px;
    margin-bottom:28px;
}


/* =========================================
   問題数
========================================= */

.count-title{
    font-size:1rem;
    font-weight:700;
    margin-bottom:14px;
}

.count-current{
    text-align:center;
    margin-bottom:18px;
}

.count-current-number{
    font-size:2.2rem;
    font-weight:800;
    color:var(--primary);
    line-height:1;
}

.count-current-unit{
    margin-top:7px;
    color:var(--sub);
    font-size:.9rem;
}


/* =========================================
   数字入力
========================================= */

.count-input-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
}

.count-input{
    width:110px;
    padding:11px;
    box-sizing:border-box;
    text-align:center;
    font-size:1.2rem;
    font-weight:700;
    background:#0f1115;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
}

.count-input:focus{
    border-color:var(--primary);
    box-shadow:
        0 0 0 3px
        rgba(29,155,240,.10);
}

.count-input-unit{
    color:var(--sub);
}


/* =========================================
   スライダー
========================================= */

.count-slider{
    width:100%;
    margin:0;
    padding:0;
    cursor:pointer;
}

.count-slider::-webkit-slider-runnable-track{
    height:6px;
    background:#2f3336;
    border-radius:999px;
}

.count-slider::-webkit-slider-thumb{
    appearance:none;
    width:18px;
    height:18px;
    margin-top:-6px;
    border:none;
    border-radius:50%;
    background:var(--primary);
    cursor:pointer;
}

.count-slider::-moz-range-track{
    height:6px;
    background:#2f3336;
    border-radius:999px;
}

.count-slider::-moz-range-thumb{
    width:18px;
    height:18px;
    border:none;
    border-radius:50%;
    background:var(--primary);
    cursor:pointer;
}


/* =========================================
   範囲表示
========================================= */

.count-range-info{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    color:var(--sub);
    font-size:.75rem;
}

.count-description{
    margin-top:10px;
    color:var(--sub);
    font-size:.82rem;
    line-height:1.6;
}


/* =========================================
   ボタン
========================================= */

.start-button{
    margin-top:0;
}


/* =========================================
   注意
========================================= */

.exam-note{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:20px;
    padding:16px 18px;
    background:#16181c;
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
}

.exam-note-icon{
    flex-shrink:0;
    font-size:1.15rem;
}

.exam-note-text{
    min-width:0;
}

.exam-note-text strong{
    font-weight:700;
}

.exam-note-text p{
    margin:5px 0 0;
    color:var(--sub);
    font-size:.85rem;
    line-height:1.6;
}


/* =========================================
   スマホ
========================================= */

@media(max-width:650px){

    .quiz-select-card{
        padding:22px;
    }

    .level-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>


<body>

<div class="container container-small">

    <div class="site-header">

        <div class="logo">
            Korean <span>Study</span>
        </div>

    </div>


    <div class="card quiz-select-card">


        <div class="quiz-select-header">

            <div
                id="categoryIcon"
                class="quiz-select-icon">

                📚

            </div>


            <h1 id="categoryTitle">
                読み込み中...
            </h1>


            <p>
                学習したい級と問題数を設定してください
            </p>

        </div>


        <div class="exam-note">

            <div class="exam-note-icon">
                ℹ️
            </div>

            <div class="exam-note-text">

                <strong>
                    級について
                </strong>

                <p>
                    このサイトでは
                    <strong>ハングル検定</strong>
                    の級を基準に問題を設定しています。
                </p>

            </div>

        </div>


        <!-- =====================================
             級選択
        ====================================== -->

        <div class="level-title">
            学習する級
        </div>


        <div class="level-grid">

            <button
                type="button"
                class="level-button"
                data-level="5"
                onclick="toggleLevel(this)">

                5級

            </button>


            <button
                type="button"
                class="level-button"
                data-level="4"
                onclick="toggleLevel(this)">

                4級

            </button>


            <button
                type="button"
                class="level-button"
                data-level="3"
                onclick="toggleLevel(this)">

                3級

            </button>


            <button
                type="button"
                class="level-button"
                data-level="pre2"
                onclick="toggleLevel(this)">

                準2級

            </button>


            <button
                type="button"
                class="level-button"
                data-level="2"
                onclick="toggleLevel(this)">

                2級

            </button>


            <button
                type="button"
                class="level-button"
                data-level="1"
                onclick="toggleLevel(this)">

                1級

            </button>

        </div>


        <div
            id="selectedInfo"
            class="selected-info">

            まだ級が選択されていません

        </div>


        <!-- =====================================
             問題数
        ====================================== -->

        <div class="count-title">
            問題数
        </div>


        <div class="count-current">

            <div
                id="questionDisplay"
                class="count-current-number">

                10

            </div>

            <div class="count-current-unit">
                問
            </div>

        </div>


        <div class="count-input-wrap">

            <input
                id="questionCount"
                class="count-input"
                type="number"
                min="1"
                max="100"
                value="10"
            >

            <span class="count-input-unit">
                問
            </span>

        </div>


        <input
            id="questionSlider"
            class="count-slider"
            type="range"
            min="1"
            max="100"
            value="10"
        >


        <div class="count-range-info">

            <span>
                1問
            </span>

            <span>
                最大100問
            </span>

        </div>


        <div class="count-description">

            スライダーまたは数字入力から
            問題数を設定できます。<br>

            グループの残り問題数が少なくても、
            次のグループから補充されます。

        </div>


        <button
            class="btn btn-primary start-button"
            onclick="startQuiz()">

            この設定で学習する

        </button>


        <button
            class="btn btn-secondary"
            onclick="location.href='index.html'">

            ホームへ戻る

        </button>


    </div>

</div>


<script>

/* =========================================
   基本データ
========================================= */

const categoryNames = {

    vocab:"単語",
    idiom:"慣用句",
    expression:"慣用表現",
    proverb:"ことわざ",
    saja:"四字熟語"

};


const dataFiles = {

    vocab:"data/vocab.json",
    idiom:"data/idiom.json",
    expression:"data/expression.json",
    proverb:"data/proverb.json",
    saja:"data/saja.json"

};


const categoryIcons = {

    vocab:"📚",
    idiom:"💬",
    expression:"🗣️",
    proverb:"🌱",
    saja:"漢"

};


/* =========================================
   カテゴリー
========================================= */

const category =
    localStorage.getItem(
        "selectedCategory"
    );


if(
    !category ||
    !categoryNames[category]
){

    alert(
        "カテゴリー情報がありません。"
    );

    location.href =
        "index.html";

}


/* =========================================
   カテゴリー表示
========================================= */

document.getElementById(
    "categoryTitle"
).textContent =
    categoryNames[category];


document.getElementById(
    "categoryIcon"
).textContent =
    categoryIcons[category];


/* =========================================
   状態
========================================= */

const selectedLevels = [];

let allQuestions = [];


/* =========================================
   DOM
========================================= */

const questionCount =
    document.getElementById(
        "questionCount"
    );

const questionSlider =
    document.getElementById(
        "questionSlider"
    );

const questionDisplay =
    document.getElementById(
        "questionDisplay"
    );


/* =========================================
   問題数表示
========================================= */

function updateQuestionDisplay(){

    let count =
        Number(
            questionCount.value
        );


    if(
        !Number.isInteger(count) ||
        count < 1
    ){

        count = 1;

    }


    if(count > 100){

        count = 100;

    }


    questionCount.value =
        count;

    questionSlider.value =
        count;

    questionDisplay.textContent =
        count;

}


/* =========================================
   数字入力
========================================= */

questionCount.addEventListener(
    "input",
    function(){

        updateQuestionDisplay();

    }
);


/* =========================================
   スライダー
========================================= */

questionSlider.addEventListener(
    "input",
    function(){

        questionCount.value =
            this.value;

        questionDisplay.textContent =
            this.value;

    }
);


/* =========================================
   級選択
========================================= */

function toggleLevel(button){

    if(button.disabled){

        return;

    }


    const level =
        button.dataset.level;


    const index =
        selectedLevels.indexOf(
            level
        );


    if(index === -1){

        selectedLevels.push(
            level
        );

        button.classList.add(
            "selected"
        );

    }else{

        selectedLevels.splice(
            index,
            1
        );

        button.classList.remove(
            "selected"
        );

    }


    updateSelectedInfo();

}


/* =========================================
   選択状況
========================================= */

function updateSelectedInfo(){

    const info =
        document.getElementById(
            "selectedInfo"
        );


    if(
        selectedLevels.length === 0
    ){

        info.textContent =
            "まだ級が選択されていません";

        return;

    }


    const names =
        selectedLevels.map(
            level => {

                if(level === "pre2"){

                    return "準2級";

                }

                return level + "級";

            }
        );


    info.textContent =
        "選択中：" +
        names.join("・");

}


/* =========================================
   問題が存在する級を確認
========================================= */

async function loadQuestions(){

    try{

        const response =
            await fetch(
                dataFiles[category]
            );


        if(!response.ok){

            throw new Error(
                "問題データを読み込めませんでした。"
            );

        }


        allQuestions =
            await response.json();


        const levels = [
            "5",
            "4",
            "3",
            "pre2",
            "2",
            "1"
        ];


        levels.forEach(
            level => {

                const count =
                    allQuestions.filter(
                        question =>
                            String(
                                question.level
                            ) ===
                            String(level)
                    ).length;


                const button =
                    document.querySelector(
                        `.level-button[data-level="${level}"]`
                    );


                if(!button){

                    return;

                }


                if(count === 0){

                    button.classList.add(
                        "disabled"
                    );

                    button.disabled =
                        true;

                    button.title =
                        "この級には現在問題がありません。";

                }

            }
        );

    }catch(error){

        console.error(error);

        alert(
            "問題データを読み込めませんでした。"
        );

    }

}


/* =========================================
   学習開始
========================================= */

function startQuiz(){

    if(
        selectedLevels.length === 0
    ){

        alert(
            "学習する級を1つ以上選択してください。"
        );

        return;

    }


    let count =
        Number(
            questionCount.value
        );


    if(
        !Number.isInteger(count) ||
        count < 1
    ){

        alert(
            "問題数は1問以上にしてください。"
        );

        return;

    }


    if(count > 100){

        count = 100;

    }


    /*
       ★重要

       ここでは現在の未学習数を
       問題数の上限にしない。

       残り1問でも10問設定なら10問。

       category-quiz.html側で
       次のグループから補充する。
    */


    localStorage.setItem(
        "selectedCategory",
        category
    );


    localStorage.setItem(
        "selectedLevels",
        JSON.stringify(
            selectedLevels
        )
    );


    localStorage.setItem(
        "questionCount",
        count
    );


    location.href =
        "category-quiz.html";

}


/* =========================================
   初期化
========================================= */

loadQuestions();

</script>

</body>

</html>

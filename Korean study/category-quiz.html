<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>韓国語学習</title>

<link
    rel="stylesheet"
    href="style.css">

<script src="study-tracker.js"></script>

<style>

.quiz-page{
    max-width:700px;
    margin:0 auto;
}

.quiz-top{
    text-align:center;
    margin-bottom:20px;
}

.quiz-category{
    font-size:1.25rem;
    font-weight:700;
}

.quiz-level{
    color:var(--sub);
    margin-top:5px;
    font-size:.85rem;
}

.quiz-progress{
    color:var(--sub);
    margin-top:8px;
}

.quiz-question{
    text-align:center;
    font-size:clamp(2rem,6vw,3rem);
    font-weight:700;
    margin:50px 0 35px;
    word-break:break-word;
}

.quiz-answer{
    width:100%;
    padding:15px;
    background:#0f1115;
    color:var(--text);
    border:2px solid var(--border);
    border-radius:12px;
    outline:none;
    font-size:1.05rem;
    box-sizing:border-box;
}

.quiz-answer:focus{
    border-color:var(--primary);
}

.quiz-answer:disabled{
    opacity:.7;
}

.quiz-buttons{
    margin-top:14px;
}

.quiz-buttons .btn + .btn{
    margin-top:10px;
}

.quiz-hint{
    min-height:24px;
    margin-top:14px;
    text-align:center;
    color:var(--sub);
}

.quiz-result{
    margin-top:18px;
    padding:15px;
    border-radius:12px;
    text-align:center;
    line-height:1.7;
}

.quiz-result.correct{
    background:rgba(0,186,124,.12);
    color:#00ba7c;
}

.quiz-result.wrong{
    background:rgba(244,33,46,.12);
    color:#f4212e;
}

.quiz-result.unknown{
    background:rgba(29,155,240,.12);
    color:#1d9bf0;
}


/* =========================================
   結果画面
========================================= */

.finish{
    text-align:center;
}

.finish-icon{
    font-size:3rem;
}

.finish-title{
    font-size:1.6rem;
    font-weight:700;
    margin-top:10px;
}

.finish-score{
    font-size:3rem;
    font-weight:800;
    color:var(--primary);
    margin:20px 0;
}

.finish-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0;
}

.finish-stat{
    background:#0f1115;
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
}

.finish-stat-label{
    color:var(--sub);
    font-size:.8rem;
}

.finish-stat-value{
    font-size:1.4rem;
    font-weight:700;
    margin-top:5px;
}

.finish-question-list{
    margin-top:25px;
    text-align:left;
}

.finish-question-list-title{
    font-size:1rem;
    font-weight:700;
    margin-bottom:10px;
}

.finish-question-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    margin-top:8px;
    border-radius:10px;
    background:#0f1115;
    border:1px solid var(--border);
}

.finish-question-icon{
    flex:none;
    font-size:1.1rem;
}

.finish-question-text{
    flex:1;
    min-width:0;
}

.finish-question-japanese{
    font-weight:600;
}

.finish-question-answer{
    margin-top:3px;
    color:var(--sub);
    font-size:.85rem;
    word-break:break-word;
}

.finish-question-correct{
    border-color:rgba(0,186,124,.3);
}

.finish-question-wrong{
    border-color:rgba(244,33,46,.3);
}


/* =========================================
   アニメーション
========================================= */

.quiz-correct-animation{
    animation:correctShake .3s ease;
}

.quiz-wrong-animation{
    animation:wrongShake .32s ease;
}

.quiz-unknown-animation{
    animation:unknownPop .28s ease;
}

.quiz-pop-animation{
    animation:quizPop .25s ease;
}

.quiz-card-correct-glow{
    box-shadow:
        0 0 0 2px rgba(0,186,124,.35),
        0 0 25px rgba(0,186,124,.22),
        0 0 60px rgba(0,186,124,.12);

    animation:correctGlow .45s ease;
}

.quiz-card-wrong-glow{
    box-shadow:
        0 0 0 2px rgba(244,33,46,.35),
        0 0 25px rgba(244,33,46,.22),
        0 0 60px rgba(244,33,46,.12);

    animation:wrongGlow .45s ease;
}


@keyframes correctShake{

    0%{transform:translateY(0);}
    25%{transform:translateY(-2px);}
    50%{transform:translateY(2px);}
    75%{transform:translateY(-1px);}
    100%{transform:translateY(0);}

}

@keyframes wrongShake{

    0%{transform:translateX(0);}
    25%{transform:translateX(-3px);}
    50%{transform:translateX(3px);}
    75%{transform:translateX(-2px);}
    100%{transform:translateX(0);}

}

@keyframes unknownPop{

    0%{
        transform:scale(.98);
        opacity:.6;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

@keyframes quizPop{

    0%{
        opacity:.6;
        transform:
            scale(.98)
            translateY(3px);
    }

    100%{
        opacity:1;
        transform:
            scale(1)
            translateY(0);
    }

}

@keyframes correctGlow{

    0%{
        box-shadow:
            0 0 0 0 rgba(0,186,124,0),
            0 0 0 rgba(0,186,124,0);
    }

    40%{
        box-shadow:
            0 0 0 3px rgba(0,186,124,.4),
            0 0 45px rgba(0,186,124,.3),
            0 0 80px rgba(0,186,124,.15);
    }

    100%{
        box-shadow:
            0 0 0 2px rgba(0,186,124,.35),
            0 0 25px rgba(0,186,124,.22),
            0 0 60px rgba(0,186,124,.12);
    }

}

@keyframes wrongGlow{

    0%{
        box-shadow:
            0 0 0 0 rgba(244,33,46,0),
            0 0 0 rgba(244,33,46,0);
    }

    40%{
        box-shadow:
            0 0 0 3px rgba(244,33,46,.4),
            0 0 45px rgba(244,33,46,.3),
            0 0 80px rgba(244,33,46,.15);
    }

    100%{
        box-shadow:
            0 0 0 2px rgba(244,33,46,.35),
            0 0 25px rgba(244,33,46,.22),
            0 0 60px rgba(244,33,46,.12);
    }

}

@media(max-width:650px){

    .finish-stats{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="container quiz-page">

    <div class="site-header">

        <div class="logo">
            Korean <span>Study</span>
        </div>

    </div>


    <div class="quiz-top">

        <div
            id="categoryTitle"
            class="quiz-category">
            読み込み中...
        </div>

        <div
            id="levelName"
            class="quiz-level">
        </div>

        <div
            id="progress"
            class="quiz-progress">
        </div>

    </div>


    <div
        id="quizCard"
        class="card">

        <div
            id="question"
            class="quiz-question">
        </div>

        <input
            id="answer"
            class="quiz-answer"
            type="text"
            placeholder="韓国語を入力"
            autocomplete="off">


        <div class="quiz-buttons">

            <button
                id="checkBtn"
                class="btn btn-primary">

                答え合わせ

            </button>


            <button
                id="unknownBtn"
                class="btn btn-secondary">

                わからない

            </button>


            <button
                id="hintBtn"
                class="btn btn-secondary">

                ヒント

            </button>


            <button
                id="nextBtn"
                class="btn btn-success"
                style="display:none;">

                次の問題

            </button>

        </div>


        <div
            id="hint"
            class="quiz-hint">
        </div>


        <div
            id="result"
            class="quiz-result">
        </div>


        <button
            id="homeBtn"
            class="btn btn-secondary"
            style="margin-top:20px;">

            ← ホームへ戻る

        </button>

    </div>

</div>


<script>

/* =====================================================
   基本設定
===================================================== */

const category =
    localStorage.getItem("selectedCategory");


let selectedLevels = [];

try{

    selectedLevels =
        JSON.parse(
            localStorage.getItem("selectedLevels") || "[]"
        );

}catch(error){

    selectedLevels = [];

}


const categoryNames = {

    vocab:
        "単語",

    idiom:
        "慣用句",

    expression:
        "慣用表現",

    proverb:
        "ことわざ",

    saja:
        "四字熟語"

};


const dataFiles = {

    vocab:
        "data/vocab.json",

    idiom:
        "data/idiom.json",

    expression:
        "data/expression.json",

    proverb:
        "data/proverb.json",

    saja:
        "data/saja.json"

};


/* =====================================================
   状態
===================================================== */

let allQuestions = [];

let groupQuestions = [];

let questions = [];

let currentIndex = 0;

let currentQuestion = null;

let correctCount = 0;

let wrongCount = 0;

let unknownCount = 0;

let answered = false;

let roundResults = [];


/* =====================================================
   DOM
===================================================== */

let quizCard =
    document.getElementById("quizCard");

let questionElement =
    document.getElementById("question");

let answerElement =
    document.getElementById("answer");

let resultElement =
    document.getElementById("result");

let hintElement =
    document.getElementById("hint");

let checkButton =
    document.getElementById("checkBtn");

let unknownButton =
    document.getElementById("unknownBtn");

let hintButton =
    document.getElementById("hintBtn");

let nextButton =
    document.getElementById("nextBtn");


/* =====================================================
   問題数
===================================================== */

function getQuestionCount(){

    const value =
        localStorage.getItem("questionCount");

    const number =
        Number(value);

    if(
        Number.isInteger(number) &&
        number >= 1
    ){

        return number;

    }

    return 1;

}


/* =====================================================
   シャッフル
===================================================== */

function shuffle(array){

    const copied =
        [...array];

    for(
        let i = copied.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copied[i],
            copied[j]
        ] =
        [
            copied[j],
            copied[i]
        ];

    }

    return copied;

}


/* =====================================================
   学習グループ取得
===================================================== */

function getGroup(){

    if(
        typeof getCurrentStudyGroup !==
        "function"
    ){

        throw new Error(
            "study-tracker.js に getCurrentStudyGroup() がありません。"
        );

    }


    return getCurrentStudyGroup({

        category:
            category,

        levels:
            selectedLevels,

        questions:
            allQuestions,

        questionCount:
            getQuestionCount()

    });

}


/* =====================================================
   グループ内の問題を取得
=====================================================



/* =====================================================
   学習グループ準備
===================================================== */

function prepareGroup(){

    const group =
        getGroup();


    return group || null;

}


/* =====================================================
   新しい周回
===================================================== */

function createNewCycle(){

    if(
        typeof resetStudyCycle !==
        "function"
    ){

        throw new Error(
            "study-tracker.js に resetStudyCycle() がありません。"
        );

    }


    resetStudyCycle({

        category:
            category,

        levels:
            selectedLevels,

        questions:
            allQuestions

    });


    return prepareGroup();

}


/* =====================================================
   グループ削除
===================================================== */

function clearGroup(){

    if(
        typeof clearStudyGroup ===
        "function"
    ){

        clearStudyGroup();

    }

}


/* =====================================================
   学習開始
===================================================== */

function loadQuestions(){

    /*
       カテゴリー確認
    */

    if(
        !category ||
        !dataFiles[category]
    ){

        alert(
            "カテゴリーが選択されていません。"
        );

        location.href =
            "index.html";

        return;

    }


    /*
       級確認
    */

    if(
        !Array.isArray(selectedLevels) ||
        selectedLevels.length === 0
    ){

        alert(
            "級が選択されていません。"
        );

        location.href =
            "index.html";

        return;

    }


    /*
       JSONだけを読み込む
    */

    fetch(dataFiles[category])

        .then(response => {

            if(!response.ok){

                throw new Error(
                    `JSON読み込み失敗: ${dataFiles[category]} (${response.status})`
                );

            }

            return response.json();

        })

        .then(data => {

            /*
               JSONが配列か確認
            */

            if(!Array.isArray(data)){

                throw new Error(
                    `${dataFiles[category]} の中身が配列ではありません。`
                );

            }


            allQuestions =
                data;


            console.log(
                "問題データ読み込み成功:",
                allQuestions.length,
                "問"
            );


            /*
               表示
            */

            document.getElementById(
                "categoryTitle"
            ).textContent =
                categoryNames[category] ||
                category;


            document.getElementById(
                "levelName"
            ).textContent =

                "選択した級：" +

                selectedLevels
                    .map(
                        formatLevel
                    )
                    .join("・");


            /*
               JSON読み込み後に
               学習グループを準備
            */

            startRound();

        })

        .catch(error => {

            console.error(
                "クイズ初期化エラー:",
                error
            );


            /*
               JSON自体の読み込み失敗なのか
               それ以外なのかを分けて表示
            */

            const message =
                error instanceof Error
                    ? error.message
                    : String(error);


            alert(
                "クイズの読み込み中にエラーが発生しました。\n\n" +
                message
            );

        });

}


/* =====================================================
   級表示
===================================================== */

function formatLevel(level){

    if(level === "pre2"){

        return "準2級";

    }

    if(level === "pre1"){

        return "準1級";

    }

    return level + "級";

}


/* =====================================================
   1回の学習開始
===================================================== */

function startRound(){

    currentIndex = 0;

    correctCount = 0;

    wrongCount = 0;

    unknownCount = 0;

    answered = false;

    roundResults = [];


    const requestedCount =
        getQuestionCount();


    /*
       現在のグループ
    */

    let group =
        prepareGroup();


    /*
       グループがない
    */

    if(!group){

        showAllFinished();

        return;

    }


    /*
       グループ内の問題
    */

groupQuestions =
    getCurrentStudyGroupWords({

        category:
            category,

        levels:
            selectedLevels,

        questions:
            allQuestions,

        questionCount:
            getQuestionCount()

    });


    /*
       まだ3回正解していない問題
    */

    let available =
        groupQuestions.filter(
            question => {

                if(
                    typeof isWordLearned !==
                    "function"
                ){

                    throw new Error(
                        "study-tracker.js に isWordLearned() がありません。"
                    );

                }


                return !isWordLearned({

                    category:
                        category,

                    level:
                        question.level,

                    id:
                        question.id

                });

            }
        );


    /*
       グループ内が全部学習済み
    */

    if(available.length === 0){

        clearGroup();


        group =
            prepareGroup();


        if(!group){

            showAllFinished();

            return;

        }


        groupQuestions =
    getCurrentStudyGroupWords({

        category:
            category,

        levels:
            selectedLevels,

        questions:
            allQuestions,

        questionCount:
            getQuestionCount()

    });


        available =
            groupQuestions.filter(
                question =>

                    !isWordLearned({

                        category:
                            category,

                        level:
                            question.level,

                        id:
                            question.id

                    })
            );

    }


    /*
       今回の問題数だけ取得
    */

    questions =
        shuffle(
            available
        ).slice(
            0,
            Math.min(
                requestedCount,
                available.length
            )
        );


    if(questions.length === 0){

        showAllFinished();

        return;

    }


    document.getElementById(
        "progress"
    ).textContent =

        `1 / ${questions.length}`;


    showQuestion();

}


/* =====================================================
   問題表示
===================================================== */

function showQuestion(){

    if(
        currentIndex >=
        questions.length
    ){

        showFinished();

        return;

    }


    currentQuestion =
        questions[currentIndex];


    answered = false;


    questionElement.textContent =
        currentQuestion.japanese;


    document.getElementById(
        "progress"
    ).textContent =

        `${currentIndex + 1} / ${questions.length}`;


    answerElement.value =
        "";

    answerElement.disabled =
        false;


    resultElement.textContent =
        "";

    resultElement.className =
        "quiz-result";


    hintElement.textContent =
        "";


    checkButton.style.display =
        "flex";

    unknownButton.style.display =
        "flex";

    hintButton.style.display =
        "flex";

    nextButton.style.display =
        "none";


    nextButton.textContent =

        currentIndex + 1 >=
        questions.length

        ? "結果を見る"

        : "次の問題";


    playAnimation(
        "quiz-pop-animation"
    );


    answerElement.focus();

}


/* =====================================================
   回答終了
===================================================== */

function finishQuestion(){

    answered = true;

    answerElement.disabled =
        true;

    checkButton.style.display =
        "none";

    unknownButton.style.display =
        "none";

    nextButton.style.display =
        "flex";

}


/* =====================================================
   正解判定
===================================================== */

function checkAnswer(){

    if(answered){

        return;

    }


    const userAnswer =
        answerElement.value.trim();


    if(!userAnswer){

        alert(
            "答えを入力してください。"
        );

        answerElement.focus();

        return;

    }


    const isCorrect =
        userAnswer ===
        currentQuestion.korean;


    if(isCorrect){

        correctCount++;


        if(
            typeof addWordCorrect !==
            "function"
        ){

            throw new Error(
                "study-tracker.js に addWordCorrect() がありません。"
            );

        }


        const newCount =
            addWordCorrect({

                category:
                    category,

                level:
                    currentQuestion.level,

                id:
                    currentQuestion.id

            });


        resultElement.className =
            "quiz-result correct";


        resultElement.innerHTML =

            newCount >= 3

            ? "⭕ 正解！<br><b>この単語は3回正解しました。</b>"

            : "⭕ 正解！<br>" +
              `この単語の正解回数：${newCount} / 3`;


        playAnimation(
            "quiz-correct-animation"
        );


        quizCard.classList.add(
            "quiz-card-correct-glow"
        );


        roundResults.push({

            id:
                currentQuestion.id,

            question:
                currentQuestion.japanese,

            answer:
                currentQuestion.korean,

            result:
                "correct"

        });


        saveStudyResultSafe({

            category:
                category,

            categoryName:
                categoryNames[category],

            id:
                currentQuestion.id,

            level:
                currentQuestion.level,

            question:
                currentQuestion.japanese,

            answer:
                currentQuestion.korean,

            correct:
                true,

            resultType:
                "correct"

        });

    }else{

        wrongCount++;


        resultElement.className =
            "quiz-result wrong";


        resultElement.innerHTML =

            "❌ 不正解<br>" +

            "正解：<b>" +

            escapeHtml(
                currentQuestion.korean
            ) +

            "</b><br>" +

            "この単語の正解回数は増えません。";


        playAnimation(
            "quiz-wrong-animation"
        );


        quizCard.classList.add(
            "quiz-card-wrong-glow"
        );


        roundResults.push({

            id:
                currentQuestion.id,

            question:
                currentQuestion.japanese,

            answer:
                currentQuestion.korean,

            result:
                "wrong"

        });


        saveWrongWord();


        saveStudyResultSafe({

            category:
                category,

            categoryName:
                categoryNames[category],

            id:
                currentQuestion.id,

            level:
                currentQuestion.level,

            question:
                currentQuestion.japanese,

            answer:
                currentQuestion.korean,

            correct:
                false,

            resultType:
                "wrong"

        });

    }


    finishQuestion();

}


/* =====================================================
   わからない
===================================================== */

function markUnknown(){

    if(answered){

        return;

    }


    unknownCount++;


    resultElement.className =
        "quiz-result unknown";


    resultElement.innerHTML =

        "🤔 わからない<br>" +

        "正解：<b>" +

        escapeHtml(
            currentQuestion.korean
        ) +

        "</b><br>" +

        "この単語の正解回数は増えません。";


    roundResults.push({

        id:
            currentQuestion.id,

        question:
            currentQuestion.japanese,

        answer:
            currentQuestion.korean,

        result:
            "unknown"

    });


    saveWrongWord();


    saveStudyResultSafe({

        category:
            category,

        categoryName:
            categoryNames[category],

        id:
            currentQuestion.id,

        level:
            currentQuestion.level,

        question:
            currentQuestion.japanese,

        answer:
            currentQuestion.korean,

        correct:
            false,

        resultType:
            "unknown"

    });


    playAnimation(
        "quiz-unknown-animation"
    );


    finishQuestion();

}


/* =====================================================
   学習履歴保存
===================================================== */

function saveStudyResultSafe(data){

    if(
        typeof saveStudyResult ===
        "function"
    ){

        saveStudyResult(data);

    }

}


/* =====================================================
   苦手単語保存
===================================================== */

function saveWrongWord(){

    let wrongWords = [];


    try{

        wrongWords =
            JSON.parse(
                localStorage.getItem(
                    "wrongWords"
                ) || "[]"
            );

    }catch(error){

        wrongWords = [];

    }


    const index =
        wrongWords.findIndex(
            word =>

                word.category ===
                category &&

                String(word.id) ===
                String(currentQuestion.id)
        );


    if(index !== -1){

        wrongWords[index].correctStreak =
            0;

    }else{

        wrongWords.push({

            category:
                category,

            categoryName:
                categoryNames[category],

            id:
                currentQuestion.id,

            level:
                currentQuestion.level,

            question:
                currentQuestion.japanese,

            answer:
                currentQuestion.korean,

            hint:
                currentQuestion.hint || "",

            correctStreak:
                0

        });

    }


    localStorage.setItem(
        "wrongWords",
        JSON.stringify(wrongWords)
    );

}


/* =====================================================
   ヒント
===================================================== */

function showHint(){

    if(!currentQuestion){

        return;

    }


    hintElement.textContent =

        "ヒント：" +

        (
            currentQuestion.hint ||
            "ヒントはありません。"
        );

}


/* =====================================================
   次の問題
===================================================== */

function nextQuestion(){

    if(!answered){

        return;

    }


    currentIndex++;


    if(
        currentIndex <
        questions.length
    ){

        showQuestion();

        return;

    }


    showFinished();

}


/* =====================================================
   結果画面
===================================================== */

function showFinished(){

    const total =
        roundResults.length;


    const rate =
        total > 0

        ? Math.round(
            correctCount /
            total *
            100
        )

        : 0;


    const listHtml =
        roundResults.map(item => {

            let icon =
                "🤔";

            let className =
                "finish-question-item";


            if(
                item.result ===
                "correct"
            ){

                icon =
                    "⭕";

                className +=
                    " finish-question-correct";

            }


            if(
                item.result ===
                "wrong"
            ){

                icon =
                    "❌";

                className +=
                    " finish-question-wrong";

            }


            return `

                <div class="${className}">

                    <div class="finish-question-icon">
                        ${icon}
                    </div>

                    <div class="finish-question-text">

                        <div class="finish-question-japanese">
                            ${escapeHtml(item.question)}
                        </div>

                        <div class="finish-question-answer">
                            ${escapeHtml(item.answer)}
                        </div>

                    </div>

                </div>

            `;

        }).join("");


    quizCard.innerHTML = `

        <div class="finish">

            <div class="finish-icon">
                🎉
            </div>

            <div class="finish-title">
                学習終了！
            </div>

            <div class="finish-score">
                ${rate}%
            </div>

            <div class="finish-stats">

                <div class="finish-stat">

                    <div class="finish-stat-label">
                        今回の問題
                    </div>

                    <div class="finish-stat-value">
                        ${total}問
                    </div>

                </div>


                <div class="finish-stat">

                    <div class="finish-stat-label">
                        正解
                    </div>

                    <div class="finish-stat-value">
                        ${correctCount}問
                    </div>

                </div>


                <div class="finish-stat">

                    <div class="finish-stat-label">
                        不正解・不明
                    </div>

                    <div class="finish-stat-value">
                        ${wrongCount + unknownCount}問
                    </div>

                </div>

            </div>


            <div class="finish-question-list">

                <div class="finish-question-list-title">
                    今回の結果
                </div>

                ${listHtml}

            </div>


            <button
                id="retryButton"
                class="btn btn-primary"
                style="margin-top:25px;">

                もう一度学習する

            </button>


            <button
                id="homeButton"
                class="btn btn-secondary">

                ホームへ戻る

            </button>

        </div>

    `;


    document.getElementById(
        "retryButton"
    ).onclick = function(){

        restoreQuizDOM();

        startRound();

    };


    document.getElementById(
        "homeButton"
    ).onclick = function(){

        location.href =
            "index.html";

    };


    playAnimation(
        "quiz-pop-animation"
    );

}


/* =====================================================
   全部学習済み
===================================================== */

function showAllFinished(){

    quizCard.innerHTML = `

        <div class="finish">

            <div class="finish-icon">
                🏆
            </div>

            <div class="finish-title">
                すべての単語を学習しました！
            </div>

            <p style="
                color:var(--sub);
                margin:20px 0;
                line-height:1.7;
            ">

                選択した級の単語を<br>
                すべて3回正解しました。

            </p>


            <button
                id="newCycleButton"
                class="btn btn-primary">

                新しい周回を始める

            </button>


            <button
                id="allHomeButton"
                class="btn btn-secondary">

                ホームへ戻る

            </button>

        </div>

    `;


    document.getElementById(
        "newCycleButton"
    ).onclick = function(){

        try{

            clearGroup();

            createNewCycle();

            restoreQuizDOM();

            startRound();

        }catch(error){

            console.error(
                "新しい周回の開始に失敗:",
                error
            );

            alert(
                "新しい周回を開始できませんでした。\n\n" +
                error.message
            );

        }

    };


    document.getElementById(
        "allHomeButton"
    ).onclick = function(){

        location.href =
            "index.html";

    };

}


/* =====================================================
   学習画面復元
===================================================== */

function restoreQuizDOM(){

    quizCard.innerHTML = `

        <div
            id="question"
            class="quiz-question">
        </div>


        <input
            id="answer"
            class="quiz-answer"
            type="text"
            placeholder="韓国語を入力"
            autocomplete="off">


        <div class="quiz-buttons">

            <button
                id="checkBtn"
                class="btn btn-primary">

                答え合わせ

            </button>


            <button
                id="unknownBtn"
                class="btn btn-secondary">

                わからない

            </button>


            <button
                id="hintBtn"
                class="btn btn-secondary">

                ヒント

            </button>


            <button
                id="nextBtn"
                class="btn btn-success"
                style="display:none;">

                次の問題

            </button>

        </div>


        <div
            id="hint"
            class="quiz-hint">
        </div>


        <div
            id="result"
            class="quiz-result">
        </div>


        <button
            id="homeBtn"
            class="btn btn-secondary"
            style="margin-top:20px;">

            ← ホームへ戻る

        </button>

    `;


    reconnectQuizElements();

}


/* =====================================================
   DOM再接続
===================================================== */

function reconnectQuizElements(){

    questionElement =
        document.getElementById(
            "question"
        );


    answerElement =
        document.getElementById(
            "answer"
        );


    resultElement =
        document.getElementById(
            "result"
        );


    hintElement =
        document.getElementById(
            "hint"
        );


    checkButton =
        document.getElementById(
            "checkBtn"
        );


    unknownButton =
        document.getElementById(
            "unknownBtn"
        );


    hintButton =
        document.getElementById(
            "hintBtn"
        );


    nextButton =
        document.getElementById(
            "nextBtn"
        );


    if(checkButton){

        checkButton.onclick =
            checkAnswer;

    }


    if(unknownButton){

        unknownButton.onclick =
            markUnknown;

    }


    if(hintButton){

        hintButton.onclick =
            showHint;

    }


    if(nextButton){

        nextButton.onclick =
            nextQuestion;

    }


    const homeButton =
        document.getElementById(
            "homeBtn"
        );


    if(homeButton){

        homeButton.onclick =
            function(){

                location.href =
                    "index.html";

            };

    }

}


/* =====================================================
   アニメーション
===================================================== */

function playAnimation(className){

    if(!quizCard){

        return;

    }


    quizCard.classList.remove(

        "quiz-correct-animation",

        "quiz-wrong-animation",

        "quiz-unknown-animation",

        "quiz-pop-animation",

        "quiz-card-correct-glow",

        "quiz-card-wrong-glow"

    );


    void quizCard.offsetWidth;


    quizCard.classList.add(
        className
    );

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(text ?? "");


    return div.innerHTML;

}


/* =====================================================
   Enterキー
===================================================== */

document.addEventListener(

    "keydown",

    function(event){

        if(
            event.key !==
            "Enter"
        ){

            return;

        }


        if(event.isComposing){

            return;

        }


        const retryButton =
            document.getElementById(
                "retryButton"
            );


        if(retryButton){

            event.preventDefault();

            retryButton.click();

            return;

        }


        if(!answerElement){

            return;

        }


        event.preventDefault();


        if(answered){

            nextQuestion();

        }else{

            checkAnswer();

        }

    },

    true

);


/* =====================================================
   開始
===================================================== */

reconnectQuizElements();

loadQuestions();

</script>

</body>

</html>
